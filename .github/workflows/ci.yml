name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by full commit SHA (ADR 0006); the comment names the tag.
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Must be a supported Go release line: govulncheck gates on stdlib advisories,
          # and EOL lines (1.24 since Feb 2026) no longer receive stdlib security fixes.
          # go.mod's `go 1.24` stays as the minimum language version.
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck rpm lintian
          go install golang.org/x/vuln/cmd/govulncheck@latest
          python3 -m venv /tmp/spdx && /tmp/spdx/bin/pip install -q spdx-tools==0.8.3 reuse==6.2.0  # SBOM + REUSE validation (CI-only tools)
          echo /tmp/spdx/bin >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint (installs frontend deps without scripts)
        run: make lint
      - name: Build (embeds UI)
        run: make build
      - name: Go tests (non-root runner)
        run: make test-go
      - name: Frontend tests
        run: make test-frontend
      - name: Security gate
        run: make security
      - name: Reproducible build check
        run: make repro-check
      - name: Packages (deb, rpm)
        run: |
          make deb
          packaging/fedora/build-rpm.sh "$(git describe --tags --always)"
      - name: Release payload compliance (deb, rpm)
        run: |
          for p in build/*.deb build/*.rpm; do scripts/package-inventory.sh "$p" "$p.inventory.txt"; done
          # Debian copyright/licence tags only; other lintian findings are tracked separately (dev package).
          for p in build/*.deb; do
            lintian --tag-display-limit 0 "$p" | tee "$p.lintian.txt" || true
            if grep -iE 'copyright|licen[cs]e|dep-?5' "$p.lintian.txt"; then echo "::error::lintian copyright/licence findings in $p"; exit 1; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build
          path: |
            build/hc-api
            build/hc-broker
            build/hlctl
            build/SHA256SUMS
            build/*.deb
            build/*.rpm
            build/*.inventory.txt
            build/*.lintian.txt

  # LA-13 / owner item 10: assembles the complete release (corresponding-source archive with the npm
  # sources of everything compiled in, binaries, packages, notices, SBOM, SHA256SUMS), builds binaries
  # and .deb/.rpm only from that archive and requires them to match a build from git. Runs twice on
  # independent runners (a, b); release-repro compares the two. Publishes nothing: this workflow has
  # read-only permissions, and there is no release/tag workflow (ADR 0009 prerequisites).
  release-dry-run:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        run: [a, b]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Release dry run (nothing is published)
        run: scripts/release-bundle.sh "0.0.0~dryrun.${GITHUB_SHA::8}" dist/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dry-run-${{ matrix.run }}
          path: dist/release
          retention-days: 7

  # Arch package built from the matching source archive (packaging files from the archive, binaries
  # from the archive build), in a fresh Arch container per run.
  release-dry-run-arch:
    needs: release-dry-run
    runs-on: ubuntu-24.04
    container: archlinux:latest
    strategy:
      matrix:
        run: [a, b]
    steps:
      - name: Build tools
        run: pacman -Syu --noconfirm --needed base-devel
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dry-run-${{ matrix.run }}
          path: rel
      - name: makepkg from the source archive (as unprivileged builder)
        run: |
          set -euo pipefail
          sde=$(sed -n 's/^source_date_epoch=//p' rel/RELEASE-BUILDINFO)
          ver=$(sed -n 's/^version=//p' rel/RELEASE-BUILDINFO)
          mkdir -p x && tar -xzf rel/homelab-control-*-source.tar.gz -C x
          src=$(echo x/homelab-control-*)
          mkdir -p "$src/build" && tar -xzf rel/homelab-control-*-linux-amd64.tar.gz -C "$src/build" --strip-components=1
          useradd -m builder && chown -R builder x
          su builder -c "cd '$src' && SOURCE_DATE_EPOCH=$sde packaging/arch/build-pkg.sh '$ver'"
          scripts=$src/scripts; "$scripts/package-inventory.sh" "$src"/build/*.pkg.tar.zst >/dev/null
          mkdir -p out && cp "$src"/build/*.pkg.tar.zst out/ && (cd out && sha256sum -- *.pkg.tar.zst | tee SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dry-run-arch-${{ matrix.run }}
          path: out
          retention-days: 7

  # Compares the complete dry-run outputs of the two independent runs (source archive, binaries
  # tarball, .deb, .rpm, Arch package, SBOM, notices) byte for byte.
  release-repro:
    needs: [release-dry-run, release-dry-run-arch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-dry-run-*
          path: r
      - name: Compare run a with run b
        run: |
          set -euo pipefail
          for k in release-dry-run release-dry-run-arch; do
            echo "== $k"; cat "r/$k-a/SHA256SUMS"
            if ! diff -u "r/$k-a/SHA256SUMS" "r/$k-b/SHA256SUMS"; then
              echo "::error title=release reproducibility::$k differs between independent runs"; exit 1
            fi
          done
          n=$(cat r/release-dry-run-a/SHA256SUMS r/release-dry-run-arch-a/SHA256SUMS | wc -l)
          echo "::notice title=release reproducibility::all $n release files identical across two independent runners ($(cut -c1-12 r/release-dry-run-arch-a/SHA256SUMS | tr '\n' ' ')arch)"

  arch-package:
    needs: check
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Build tools
        run: pacman -Syu --noconfirm --needed base-devel git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build
          path: build
      - name: makepkg (as unprivileged builder)
        run: |
          chmod +x build/hc-api build/hc-broker build/hlctl
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && packaging/arch/build-pkg.sh '${GITHUB_SHA::8}'"
      - name: Release payload compliance (Arch)
        run: for p in build/*.pkg.tar.zst; do scripts/package-inventory.sh "$p" "$p.inventory.txt"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch-package
          path: |
            build/*.pkg.tar.zst
            build/*.inventory.txt

  # Install/run/remove the native package in each target distro (no systemd as PID 1:
  # the broker and API are started by hand; services must report "unsupported").
  install-matrix:
    needs: [check, arch-package]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'debian:stable', kind: deb, prep: 'apt-get update && apt-get install -y curl' }
          - { image: 'debian:oldstable', kind: deb, prep: 'apt-get update && apt-get install -y curl' }
          - { image: 'ubuntu:24.04', kind: deb, prep: 'apt-get update && apt-get install -y curl' }
          - { image: 'ubuntu:26.04', kind: deb, prep: 'apt-get update && apt-get install -y curl' }
          - { image: 'ubuntu:22.04', kind: deb, prep: 'apt-get update && apt-get install -y curl' }
          - { image: 'fedora:latest', kind: rpm, prep: 'dnf install -y curl util-linux shadow-utils findutils' }
          - { image: 'opensuse/tumbleweed', kind: rpm, prep: 'zypper -n in curl util-linux shadow findutils' }
          - { image: 'opensuse/leap:latest', kind: rpm, prep: 'zypper -n in curl util-linux shadow findutils' }
          - { image: 'archlinux:latest', kind: zst, prep: 'pacman -Syu --noconfirm --needed curl util-linux' }
    container: ${{ matrix.image }}
    steps:
      - name: Prepare
        run: ${{ matrix.prep }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Named downloads only: other jobs' artifacts (e.g. release-dry-run's packages) must not be
      # picked up by the globs below.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: arch-package
          path: artifacts
      - name: Install test
        run: |
          touch /etc/hc-disposable
          case "${{ matrix.kind }}" in
            deb) pkg=$(ls artifacts/*.deb) ;;
            rpm) pkg=$(ls artifacts/*.rpm) ;;
            zst) pkg=$(ls artifacts/*.pkg.tar.zst) ;;
          esac
          HC_DISTRO="${{ matrix.image }}" tests/packaging/install-test.sh "$pkg"

  # Real systemd: the GitHub runner VM boots systemd as PID 1 and is discarded after the job.
  systemd-ubuntu:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build
          path: build
      - name: Package + hardened units under systemd (incl. real upstream Webmin)
        run: |
          sudo touch /etc/hc-disposable
          sudo env HC_SMOKE_EXTRA_UNITS=homelab-control-broker.socket \
            HC_SMOKE_EXTRA_CHECKS="$PWD/tests/systemd/m1-checks.sh" \
            HC_WEBMIN_SRC="$PWD/compat/webmin" \
            HC_SMOKE_SCOPES=system.read,services.read,hardware.read \
            tests/systemd/systemd-smoke.sh "$(ls build/*.deb)"

  # Ubuntu 26.04 LTS under real systemd (newer systemd than the 24.04 runner).
  # Disposable debootstrapped container with systemd as PID 1, on the throwaway runner VM.
  systemd-ubuntu-2604:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build
          path: build
      - name: Package + hardened units under systemd on 26.04 (resolute)
        run: |
          sudo apt-get update && sudo apt-get install -y debootstrap
          set -o pipefail
          if ! sudo dev/disposable/systemd-container.sh resolute "$(ls build/*.deb)" \
            HC_SMOKE_EXTRA_UNITS=homelab-control-broker.socket HC_SMOKE_EXTRA_CHECKS=/opt/hc/tests/m1-checks.sh \
            HC_WEBMIN_SRC=/opt/hc/webmin HC_SMOKE_SCOPES=system.read,services.read,hardware.read 2>&1 | tee /tmp/sd.log; then
            echo "::error title=systemd-ubuntu-2604::$(grep -E 'FAIL|rror|E: |unsupported|denied|systemd|cgroup|Failed' /tmp/sd.log | tail -n 25 | sed ':a;N;$!ba;s/\n/%0A/g')%0A--- tail ---%0A$(tail -n 15 /tmp/sd.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

  browser-e2e:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build
          path: build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Playwright
        run: |
          pip install playwright==1.63.0  # >= 1.61 needed for Ubuntu 26.04; same pin as dev/vm/guest-validate.sh
          python -m playwright install --with-deps chromium firefox webkit
      - name: API security checks + browser e2e (unprivileged)
        env:
          HC_CSP_BROWSERS: chromium,firefox,webkit
        run: |
          chmod +x build/hc-api build/hlctl
          tests/integration/run-hc-e2e.sh

  upstream-perl-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Upstream Webmin test suite (pinned baseline)
        working-directory: compat/webmin
        run: |
          sudo apt-get update && sudo apt-get install -y libperl-critic-perl
          prove -lr t
