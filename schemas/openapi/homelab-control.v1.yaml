openapi: 3.1.0
info:
  title: Homelab Control API
  version: 1.1.0-m1
  description: >
    Versioned management API. M0 exposes authentication and a read-only host overview only.
    All non-GET requests require an Origin header matching the server and the session's
    X-CSRF-Token. Every endpoint except /health and /auth/login requires a session cookie.
servers:
  - url: /api/v1
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-hc_session
      description: "Named hc_session (no Secure flag) only in loopback dev-insecure-http mode."
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, examples: [unauthenticated, forbidden, csrf_rejected, origin_rejected, throttled] }
        message: { type: string }
    Session:
      type: object
      required: [username, scopes, csrf_token, version]
      properties:
        username: { type: string, pattern: '^[a-z_][a-z0-9_-]{0,31}$' }
        scopes: { type: [array, "null"], items: { type: string, enum: [system.read, services.read, hardware.read] } }
        csrf_token: { type: string }
        version: { type: string }
        legacy_url: { type: string }
    Meta:
      type: object
      required: [status, sources]
      properties:
        status: { type: string, enum: [ok, partial, unavailable] }
        sources: { type: array, items: { type: string } }
        errors: { type: array, items: { type: string } }
    Overview:
      type: object
      required: [collected_at, system, cpu, memory, filesystems, network, legacy_webmin]
      properties:
        collected_at: { type: string, format: date-time }
        system:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                hostname: { type: string }
                kernel: { type: string }
                os:
                  type: object
                  properties:
                    id: { type: string }
                    id_like: { type: string }
                    name: { type: string }
                    pretty_name: { type: string }
                    version_id: { type: string }
                distro_family: { type: string, enum: [debian, fedora, suse, arch, unknown] }
                uptime_seconds: { type: number }
                load_average: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
        cpu:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                model: { type: string }
                logical_cpus: { type: integer }
                usage_percent: { type: number, description: Omitted when it could not be sampled }
                sample_millis: { type: integer }
        memory:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                total_bytes: { type: integer }
                available_bytes: { type: integer }
                used_bytes: { type: integer }
                swap_total_bytes: { type: integer }
                swap_free_bytes: { type: integer }
        filesystems:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                view:
                  type: string
                  enum: [host, service]
                  description: "host = the host's mount table (/proc/1/mounts); service = only hc-api's sandboxed view was readable, so read_only is never set and note explains."
                note: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [kernel_source, mount_point, fs_type, read_only, probed]
                    properties:
                      kernel_source: { type: string, description: "Kernel-reported source. /dev/sdX names are volatile and are not a drive identity." }
                      mount_point: { type: string }
                      fs_type: { type: string }
                      read_only: { type: boolean, description: "Read-only on the host. Always false in the service view, where the sandbox makes every mount look read-only." }
                      probed: { type: boolean }
                      skip_reason: { type: string }
                      total_bytes: { type: integer }
                      used_bytes: { type: integer }
                      avail_bytes: { type: integer }
        network:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                interfaces:
                  type: array
                  items:
                    type: object
                    required: [name, physical, rx_bytes, tx_bytes]
                    properties:
                      name: { type: string }
                      oper_state: { type: string }
                      mac: { type: string }
                      mtu: { type: integer }
                      physical: { type: boolean }
                      speed_mbps: { type: integer }
                      rx_bytes: { type: integer }
                      tx_bytes: { type: integer }
                      addresses: { type: array, items: { type: string } }
        legacy_webmin:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                installed: { type: boolean }
                version: { type: string }
                config_readable: { type: boolean }
                configured_url: { type: string }
                privilege_needed: { type: string }
    Capability:
      type: object
      required: [id, label, path, scope, status]
      properties:
        id: { type: string, enum: [overview, services, hardware, legacy] }
        label: { type: string }
        path: { type: string }
        scope: { type: string }
        status: { type: string, enum: [available, degraded, unavailable, unsupported, forbidden] }
        reason: { type: string }
    Capabilities:
      type: object
      required: [broker, capabilities]
      properties:
        broker:
          type: object
          properties:
            status: { type: string, enum: [available, unavailable] }
            version: { type: string }
            reason: { type: string }
        capabilities: { type: array, items: { $ref: '#/components/schemas/Capability' } }
    UnitList:
      type: object
      required: [units, counts, truncated, source]
      properties:
        systemd_version: { type: string }
        truncated: { type: boolean }
        source: { type: string }
        counts: { type: object, additionalProperties: { type: integer } }
        units:
          type: array
          items:
            type: object
            required: [name, type, load, active, sub, description]
            properties:
              name: { type: string, pattern: '^[A-Za-z0-9:_.\\@-]{1,256}$' }
              type: { type: string }
              load: { type: string }
              active: { type: string }
              sub: { type: string }
              description: { type: string, maxLength: 256 }
              unit_file_state: { type: string }
              preset: { type: string }
    Hardware:
      type: object
      required: [inventory, identity]
      description: >
        inventory comes from world-readable sysfs (hc-api); identity (SMBIOS serials/UUID) from the
        broker op hardware.dmi.identity. Disk identity is never the kernel name; identity_confidence is
        high (WWN), medium (serial), low (by-id only) or none.
      properties:
        inventory: { type: object }
        identity:
          type: object
          properties:
            status: { type: string, enum: [ok, unavailable] }
            reason: { type: string }
            data: { type: object }
    LegacyWebmin:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [broker, unprivileged] }
        reason: { type: string }
        status:
          type: object
          description: Allow-listed fields only; never hashes, keys or session data.
          properties:
            installed: { type: boolean }
            version: { type: string }
            port: { type: integer }
            tls: { type: boolean }
            bind: { type: string }
            listens_on_all_interfaces: { type: boolean }
            running: { type: boolean }
            user_count: { type: integer }
            rpc_capable_users: { type: array, items: { type: string } }
            checks:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  level: { type: string, enum: [ok, warn, info] }
                  message: { type: string }
        fallback: { type: object }
paths:
  /health:
    get:
      summary: Liveness (public, no host data)
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { status: { const: ok }, api: { const: v1 } } } } } }
  /auth/login:
    post:
      summary: Create a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, maxLength: 1024 }
      responses:
        '200': { description: Session created; cookie set, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { description: Malformed body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Origin rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '415': { description: Not JSON, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Throttled, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/logout:
    post:
      summary: Destroy the current session
      security: [{ session: [], csrf: [] }]
      responses:
        '204': { description: Logged out }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Origin or CSRF rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/session:
    get:
      summary: Current session and CSRF token
      security: [{ session: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /host/overview:
    get:
      summary: Read-only host overview (scope system.read)
      security: [{ session: [] }]
      x-required-scope: system.read
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Overview' } } } }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /capabilities:
    get:
      summary: What this server can show this user right now (drives navigation)
      security: [{ session: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Capabilities' } } } }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /services:
    get:
      summary: systemd units (read-only, via broker op services.systemd.list)
      security: [{ session: [] }]
      x-required-scope: services.read
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UnitList' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: Broker failure (details are not exposed), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Broker unavailable or systemd not running, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '504': { description: Broker operation timed out, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /hardware:
    get:
      summary: Hardware inventory (read-only). Degrades instead of failing when the broker is down.
      security: [{ session: [] }]
      x-required-scope: hardware.read
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Hardware' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /legacy/webmin:
    get:
      summary: Upstream Webmin status and security review (broker), or unprivileged fallback
      security: [{ session: [] }]
      x-required-scope: system.read
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyWebmin' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
